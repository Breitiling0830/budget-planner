    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        :root {
            --bg: #F2F2F7; --card: #FFF; --main: #1C1C1E; --sec: #3A3A3C; --ter: #8E8E93;
            --orange: #FF6B35; --green: #34C759; --red: #FF3B30; --yellow: #FBBF24;
            --div: rgba(60,60,67,0.12); --shadow: 0 2px 20px rgba(0,0,0,0.06);

        * { box-sizing: border-box; }
        body { font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif; background:var(--bg); color:var(--main); -webkit-font-smoothing:antialiased; min-height:100vh; }
        input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
        .card{background:var(--card);border-radius:20px;box-shadow:var(--shadow)}
        .ios-input{background:rgba(118,118,128,.08);border-radius:12px;border:1.5px solid transparent;outline:none;transition:all .2s;width:100%;padding:14px 16px;font-size:16px;font-weight:600;color:var(--main)}
        .ios-input:focus{border-color:var(--orange);background:#fff;box-shadow:0 0 0 4px rgba(255,107,53,.1)}
        .seg{background:rgba(118,118,128,.12);border-radius:10px;padding:2px;display:flex}
        .seg-btn{border-radius:8px;padding:7px 0;font-size:13px;font-weight:700;color:var(--sec);transition:all .2s;cursor:pointer;flex:1;text-align:center}
        .seg-btn.on{background:#fff;color:var(--main);box-shadow:0 2px 8px rgba(0,0,0,.12)}
        .li{padding:13px 0;border-bottom:.5px solid var(--div)}
        .li:last-child{border-bottom:none}
        .pt{height:6px;background:rgba(118,118,128,.15);border-radius:99px;overflow:hidden}
        .pf{height:100%;border-radius:99px;transition:width .6s cubic-bezier(.34,1.56,.64,1)}
        .modal-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center}
        @media(min-width:640px){.modal-bg{align-items:center}}
        .modal-box{background:#fff;width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:24px 24px 48px;transform:translateY(100%);transition:transform .4s cubic-bezier(.16,1,.3,1)}
        @media(min-width:640px){.modal-box{border-radius:28px;padding:28px}}
        .modal-box.open{transform:translateY(0)}
        #auth{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#1C1C1E,#2C2C2E);display:flex;align-items:center;justify-content:center}
        .gbtn{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:16px 28px;font-weight:700;font-size:16px;cursor:pointer;border:none;box-shadow:0 4px 20px rgba(0,0,0,.2);transition:all .2s;color:#1C1C1E}
        .gbtn:hover{transform:scale(1.02)}.gbtn:active{transform:scale(.98)}
        .ring{position:relative;width:150px;height:150px;flex-shrink:0}
        .ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
        .toast{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-20px);background:rgba(28,28,30,.92);backdrop-filter:blur(10px);color:#fff;border-radius:99px;padding:10px 20px;font-size:13px;font-weight:700;z-index:200;opacity:0;transition:all .3s;white-space:nowrap;pointer-events:none}
        .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
        .hcard{border-left:4px solid var(--orange);padding-left:14px}
        .badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:800}

        .nav-tab{transition:all .2s}
        ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#D1D1D6;border-radius:99px}
    </style>

import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';

const auth = getAuth(FB);
const db   = getFirestore(FB);

// ─── State ───────────────────────────────────────────────
let S = { uid:null, month:'', salaries:{}, customSav:{}, items:[] };
let pendingDel = null, donutChart = null, trendChart = null, unsub = null;

// ─── Utils ───────────────────────────────────────────────
const $ = id => document.getElementById(id);
const fmt  = n  => Math.round(n).toLocaleString('en-US');
const addM = (ym,n) => { let[y,m]=ym.split('-').map(Number),d=new Date(y,m-1+n,1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; };
const mDiff= (a,b) => { const da=new Date(a+'-01'),db=new Date(b+'-01'); return (db.getFullYear()-da.getFullYear())*12+(db.getMonth()-da.getMonth()); };
const days = ym  => { const[y,m]=ym.split('-'); return new Date(y,m,0).getDate(); };
const mLbl = ym  => { const[y,m]=ym.split('-'); return `${y}年 ${parseInt(m)}月`; };
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),2500); }

// ─── Firebase ────────────────────────────────────────────
async function save() {
    if(!S.uid) return;
    try{ await setDoc(doc(db,'users',S.uid),{salaries:S.salaries,customSav:S.customSav,items:S.items}); }
    catch(e){ toast('儲存失敗，請檢查網路'); }
}
function subscribe() {
    if(unsub) unsub();
    unsub = onSnapshot(doc(db,'users',S.uid), snap => {
        if(snap.exists()){ const d=snap.data(); S.salaries=d.salaries||{}; S.customSav=d.customSav||{}; S.items=d.items||[]; }
        render();
    });
}

// ─── Auth ────────────────────────────────────────────────
$('login-btn').onclick = async () => {
    try{ await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch(e){ toast('登入失敗，請再試一次'); }
};
$('logout-btn').onclick = async () => { if(unsub)unsub(); await signOut(auth); toast('已登出'); };

onAuthStateChanged(auth, u => {
    if(u){
        S.uid = u.uid;
        $('auth').style.display = 'none';
        $('app').classList.remove('hidden');
        if(u.photoURL){ $('avatar').src=u.photoURL; $('avatar').classList.remove('hidden'); }
        $('logout-btn').classList.remove('hidden');
        const now=new Date();
        S.month = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
        $('month-label').textContent = mLbl(S.month);
        subscribe();
    } else {
        S.uid=null;
        $('auth').style.display='flex';
        $('app').classList.add('hidden');
    }
});

// ─── Month nav ───────────────────────────────────────────
$('prev-btn').onclick = () => { S.month=addM(S.month,-1); syncMonth(); render(); };
$('next-btn').onclick = () => { S.month=addM(S.month, 1); syncMonth(); render(); };
function syncMonth(){ $('month-label').textContent=mLbl(S.month); $('salary').value=S.salaries[S.month]||''; }

$('salary').addEventListener('input', e => {
    S.salaries[S.month] = Math.round(Number(e.target.value))||0;
    delete S.customSav[S.month];
    save(); render();
});
$('savings').addEventListener('change', e => {
    S.customSav[S.month] = Math.round(Number(e.target.value))||0;
    save(); render();
});
window.resetSavings = () => { delete S.customSav[S.month]; save(); render(); };

// ─── Compute ─────────────────────────────────────────────
function calcMonth(m) {
    let liv=0, ins=0, list=[];
    S.items.forEach(item => {
        const diff=mDiff(item.startM, m);
        if(diff<0) return;
        const p=diff+1; let amt=0,lbl='';
        if(item.type==='single'){
            if(diff!==0) return;
            amt=Math.round(item.total); lbl='單筆';
        } else {
            if(p<1||p>item.periods) return;
            const base=Math.floor(item.total/item.periods);
            amt = p===1 ? base+(item.total%item.periods) : base;
            lbl = `${p}/${item.periods} 期`;
        }
        list.push({...item,amt,lbl});
        if(item.cat==='living') liv+=amt;
        if(item.cat==='insurance') ins+=amt;
    });
    return { list, liv:Math.round(liv), ins:Math.round(ins) };
}

// ─── Render ──────────────────────────────────────────────
function render() {
    const sal  = Math.round(S.salaries[S.month])||0;
    const isC  = S.customSav[S.month]!==undefined;
    const sav  = isC ? S.customSav[S.month] : Math.round(sal*0.3);
    const livB = Math.round(sal*0.6);
    const insB = Math.round(sal*0.1);
    const {list,liv,ins} = calcMonth(S.month);
    const livR = livB-liv, insR=insB-ins;
    const daily= livR>0 ? Math.round(livR/days(S.month)) : 0;

    // salary sync
    const si=$('salary'); if(document.activeElement!==si) si.value=sal||'';

    // savings
    const svi=$('savings'); if(document.activeElement!==svi) svi.value=sav;
    $('sav-lbl').textContent = isC ? `自訂 (${sal>0?Math.round(sav/sal*100):0}%)` : '預設 30%';
    $('reset-sav-btn').classList.toggle('hidden',!isC);

    // overview
    $('remain-val').textContent = livR>=0 ? `$${fmt(livR)}` : `-$${fmt(Math.abs(livR))}`;
    $('remain-val').style.color  = livR<0 ? 'var(--red)' : 'var(--main)';
    $('daily-val').textContent   = `$${fmt(daily)}`;
    const sP=sal>0?Math.round(sav/sal*100):30, lP=sal>0?Math.round(liv/sal*100):0, iP=sal>0?Math.round(ins/sal*100):0;
    $('used-pct').textContent = `${lP+iP}%`;
    $('sav-pct').textContent=`${sP}%`; $('sav-amt').textContent=`$${fmt(sav)}`;
    $('liv-pct').textContent=`${lP}%`; $('liv-amt').textContent=`$${fmt(liv)}`;
    $('ins-pct').textContent=`${iP}%`; $('ins-amt').textContent=`$${fmt(ins)}`;
    updateDonut([sP,lP,iP,Math.max(0,100-sP-lP-iP)]);

    // living section
    $('liv-budget-lbl').textContent=`預算 $${fmt(livB)}`;
    $('liv-spent').textContent=`$${fmt(liv)}`;
    const lbP=livB>0?Math.min(Math.round(liv/livB*100),100):0;
    $('liv-bar').style.width=`${lbP}%`; $('liv-bar').style.background=lbP>=100?'var(--red)':'var(--yellow)';
    $('liv-remain-lbl').textContent=livR>=0?`剩餘 $${fmt(livR)}`:`超支 $${fmt(Math.abs(livR))}`;
    $('liv-remain-lbl').style.color=livR<0?'var(--red)':'#D97706';
    renderList(list.filter(i=>i.cat==='living'), $('liv-list'), 'living');

    // insurance section
    $('ins-budget-lbl').textContent=`預算 $${fmt(insB)}`;
    $('ins-spent').textContent=`$${fmt(ins)}`;
    const ibP=insB>0?Math.min(Math.round(ins/insB*100),100):0;
    $('ins-bar').style.width=`${ibP}%`; $('ins-bar').style.background=ibP>=100?'var(--red)':'var(--green)';
    $('ins-remain-lbl').textContent=insR>=0?`剩餘 $${fmt(insR)}`:`超支 $${fmt(Math.abs(insR))}`;
    $('ins-remain-lbl').style.color=insR<0?'var(--red)':'#16A34A';
    renderList(list.filter(i=>i.cat==='insurance'), $('ins-list'), 'insurance');
}

function updateDonut(data){
    const ctx=$('donut').getContext('2d');
    if(donutChart) donutChart.destroy();
    donutChart=new Chart(ctx,{type:'doughnut',data:{datasets:[{data,backgroundColor:['#FF6B35','#FBBF24','#34C759','rgba(142,142,147,.12)'],borderWidth:0,hoverOffset:4}]},options:{cutout:'72%',plugins:{legend:{display:false},tooltip:{enabled:false}},animation:{duration:600}}});
}

function renderList(items, el, cat){
    if(!items.length){ el.innerHTML=`<div class="text-center py-5 text-[12px] font-black text-[var(--ter)] opacity-40 tracking-widest">尚無紀錄</div>`; return; }
    const col=cat==='living'?'#D97706':'#16A34A';
    el.innerHTML=items.map(item=>`
    <div class="li flex justify-between items-center">
        <div class="flex-1 min-w-0 pr-3">
            <div class="text-[14px] font-black truncate">${item.name}</div>
            <div class="text-[11px] font-bold text-[var(--ter)] mt-0.5">${item.lbl}${item.type==='installment'?` · 總額 $${fmt(item.total)}`:''}</div>
        </div>
        <div class="flex items-center gap-1.5 shrink-0">
            <span class="font-black text-[15px]" style="color:${col}">$${fmt(item.amt)}</span>
            <button onclick="editItem('${item.id}')" class="w-7 h-7 rounded-full bg-[var(--bg)] flex items-center justify-center"><i class="fa-solid fa-pen text-[9px] text-[var(--ter)]"></i></button>
            <button onclick="delItem('${item.id}')" class="w-7 h-7 rounded-full bg-red-50 flex items-center justify-center"><i class="fa-solid fa-trash-can text-[9px] text-[var(--red)]"></i></button>
        </div>
    </div>`).join('');
}

// ─── History ─────────────────────────────────────────────
function renderHistory(){
    const mSet=new Set();
    Object.keys(S.salaries).forEach(m=>{ if(S.salaries[m]>0) mSet.add(m); });
    S.items.forEach(item=>{
        const end=item.type==='installment'?addM(item.startM,item.periods-1):item.startM;
        let c=item.startM; while(mDiff(c,end)>=0){ mSet.add(c); c=addM(c,1); }
    });
    const allM=[...mSet].sort().reverse();
    const t6=allM.slice(0,6).reverse();

    // Trend chart
    const tCtx=$('trend').getContext('2d');
    if(trendChart) trendChart.destroy();
    const getSpend=m=>{ const{liv,ins}=calcMonth(m); return liv+ins; };
    trendChart=new Chart(tCtx,{data:{
        labels:t6.map(m=>{ const[,mo]=m.split('-'); return `${parseInt(mo)}月`; }),
        datasets:[
            {type:'line',label:'薪資',data:t6.map(m=>S.salaries[m]||0),borderColor:'#FF6B35',backgroundColor:'rgba(255,107,53,.08)',fill:true,tension:.4,pointBackgroundColor:'#FF6B35',pointRadius:5,borderWidth:2.5},
            {type:'bar', label:'支出',data:t6.map(getSpend),backgroundColor:'rgba(251,191,36,.75)',borderRadius:8,borderSkipped:false}
        ]
    },options:{responsive:true,plugins:{legend:{position:'bottom',labels:{font:{weight:'700',size:11},padding:16,boxWidth:12,boxHeight:12}},tooltip:{callbacks:{label:c=>` $${fmt(c.raw)}`}}},scales:{y:{ticks:{callback:v=>`$${fmt(v)}`,font:{size:10,weight:'700'}},grid:{color:'rgba(0,0,0,.04)'}},x:{ticks:{font:{size:11,weight:'700'}},grid:{display:false}}}}});

    // List
    const listEl=$('hist-list');
    if(!allM.length){ listEl.innerHTML='<div class="text-center py-8 text-[var(--ter)] font-bold text-[13px]">尚無歷史資料</div>'; return; }
    listEl.innerHTML=allM.map(m=>{
        const sal=S.salaries[m]||0;
        const{liv,ins}=calcMonth(m);
        const total=Math.round(liv+ins);
        const sRate=sal>0?Math.round((sal-total)/sal*100):0;
        const over=sal>0&&total>sal*0.7;
        return `<div class="hcard">
            <div class="flex justify-between items-center mb-2.5">
                <div class="font-black text-[16px]">${mLbl(m)}</div>
                <span class="badge ${over?'bg-red-100 text-red-500':'bg-green-100 text-green-600'}">${over?'⚠ 超預算':`✓ 儲蓄 ${sRate}%`}</span>
            </div>
            <div class="grid grid-cols-3 gap-2">
                <div class="bg-[var(--bg)] rounded-xl p-2.5 text-center"><div class="text-[10px] font-black text-[var(--ter)] mb-0.5">薪資</div><div class="text-[13px] font-black">$${fmt(sal)}</div></div>
                <div class="bg-yellow-50 rounded-xl p-2.5 text-center"><div class="text-[10px] font-black text-yellow-500 mb-0.5">生活</div><div class="text-[13px] font-black text-yellow-600">$${fmt(liv)}</div></div>
                <div class="bg-green-50 rounded-xl p-2.5 text-center"><div class="text-[10px] font-black text-green-500 mb-0.5">保險</div><div class="text-[13px] font-black text-green-600">$${fmt(ins)}</div></div>
            </div>
        </div>`;
    }).join('');
}

// ─── Page switch ─────────────────────────────────────────
window.goPage = function(p){
    document.querySelectorAll('.nav-tab').forEach(t=>{
        t.style.color = t.dataset.p===p ? 'var(--orange)' : 'var(--ter)';
    });
    const hp=$('hist-page'), mp=$('main-page');
    if(p==='hist'){ hp.classList.remove('hidden'); mp.style.display='none'; renderHistory(); }
    else { hp.classList.add('hidden'); mp.style.display=''; }
};

// ─── Modal ───────────────────────────────────────────────
window.openModal = function(cat){
    $('m-cat').value=cat; $('m-id').value='';
    $('m-title').textContent=cat==='living'?'新增生活支出':'新增保險項目';
    $('m-ok').textContent='新增';
    $('m-name').value=''; $('m-amt').value=''; $('m-periods').value=''; $('m-cur').value='1';
    setType(cat==='insurance'?'installment':'single');
    $('modal').classList.remove('hidden');
    requestAnimationFrame(()=>$('mbox').classList.add('open'));
};
window.editItem = function(id){
    const item=S.items.find(i=>i.id===id); if(!item) return;
    $('m-id').value=id; $('m-cat').value=item.cat;
    $('m-title').textContent='編輯紀錄'; $('m-ok').textContent='儲存';
    $('m-name').value=item.name; $('m-amt').value=item.total;
    setType(item.type);
    if(item.type==='installment'){ $('m-periods').value=item.periods; $('m-cur').value=mDiff(item.startM,S.month)+1; }
    $('modal').classList.remove('hidden');
    requestAnimationFrame(()=>$('mbox').classList.add('open'));
};
window.closeModal = function(){ $('mbox').classList.remove('open'); setTimeout(()=>$('modal').classList.add('hidden'),380); };
window.bgClick    = function(e){ if(e.target===$('modal')) closeModal(); };
window.setType    = function(t){
    $('m-type').value=t;
    $('seg-s').classList.toggle('on',t==='single');
    $('seg-i').classList.toggle('on',t==='installment');
    $('inst-fields').classList.toggle('hidden',t!=='installment');
    updateInfo();
};
function updateInfo(){
    const p=parseInt($('m-periods').value)||0, c=parseInt($('m-cur').value)||1;
    if(p>=2&&c>=1&&c<=p){
        const s=addM(S.month,-(c-1));
        $('inst-info').textContent=`${mLbl(s)} 起，共 ${p} 期，至 ${mLbl(addM(s,p-1))}`;
    } else { $('inst-info').textContent='請填入期數與第幾期'; }
}
$('m-periods').addEventListener('input',updateInfo);
$('m-cur').addEventListener('input',updateInfo);

window.submitModal = function(){
    const editId=$('m-id').value, cat=$('m-cat').value, name=$('m-name').value.trim();
    const type=$('m-type').value, total=Math.round(Number($('m-amt').value));
    if(!name||!total||total<=0){ toast('⚠ 請填寫完整資料'); return; }
    let periods=1, startM=S.month;
    if(type==='installment'){
        periods=Math.round(Number($('m-periods').value));
        const cur=Math.round(Number($('m-cur').value));
        if(!periods||periods<2||!cur||cur<1||cur>periods){ toast('⚠ 分期數據有誤'); return; }
        startM=addM(S.month,-(cur-1));
    }
    const d={cat,name,type,total,periods,startM};
    if(editId){ const idx=S.items.findIndex(i=>i.id===editId); if(idx!==-1){ d.id=editId; S.items[idx]=d; } }
    else { d.id=Date.now().toString(); S.items.push(d); }
    save(); render(); closeModal();
    toast(editId?'✓ 已更新紀錄':'✓ 已新增紀錄');
};

// ─── Delete ──────────────────────────────────────────────
window.delItem     = id => { pendingDel=id; $('confirm').classList.remove('hidden'); };
window.closeConfirm= () => { $('confirm').classList.add('hidden'); pendingDel=null; };
window.doDelete    = () => {
    if(pendingDel){ S.items=S.items.filter(i=>i.id!==pendingDel); save(); render(); closeConfirm(); toast('✓ 已刪除紀錄'); }
};
</script>
